version: '3.8'

services:
  app:
    build: .
    container_name: bloom-habits-todos
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SQLITE_PATH=/app/data/app.db
      - GOOGLE_CLIENT_ID=13504827014-gdn9ek14fgld87pp3ad8m7jh3q2f0hq4.apps.googleusercontent.com
    volumes:
      - ./data:/app/data
